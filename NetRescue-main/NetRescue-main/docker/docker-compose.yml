version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netrescue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netrescue}
      POSTGRES_DB: ${POSTGRES_DB:-netrescue}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netrescue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # FastAPI API server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-netrescue}:${POSTGRES_PASSWORD:-netrescue}@postgres:5432/${POSTGRES_DB:-netrescue}
      API_BIND_HOST: "0.0.0.0"
      API_BIND_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../certs:/app/certs:ro

  # ---------------------------------------------------------------------------
  # Public landing site (apps/dashboard) — the product's front door
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  # ---------------------------------------------------------------------------
  # Operator console (apps/console) — the labs, wired to the API
  # ---------------------------------------------------------------------------
  console:
    build:
      context: ..
      dockerfile: docker/Dockerfile.console
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
